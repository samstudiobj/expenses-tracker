<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>Expense Tracker</h1>

        <form id="add-expense-form" novalidate>
            <div class="field">
                <label for="description-input">Description</label>
                <input type="text" id="description-input" name="description" placeholder="e.g. Coffee" autocomplete="off" autofocus>
            </div>
            <div class="field">
                <label for="amount-input">Amount</label>
                <input type="number" id="amount-input" name="amount" placeholder="0.00" step="0.01" min="0.01">
            </div>
            <div class="field">
                <label for="category-select">Category</label>
                <select id="category-select" name="category">
                    <option value="Food" selected>Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Health">Health</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <button type="submit">Add Expense</button>
            <p id="form-error" class="error" hidden></p>
        </form>

        <hr>

        <div class="action-buttons">
            <button id="load-btn">Load Expenses</button>
            <button id="export-csv-btn" type="button" class="secondary-btn">Export CSV</button>
        </div>

        <p id="loading-message" class="loading" hidden><span class="spinner"></span> Loading expenses...</p>
        <p id="error-message" class="error" hidden></p>

        <section class="dashboard">
            <div class="stat-card">
                <span class="stat-label">Total Expenses</span>
                <span class="stat-value" id="stat-count">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Total Amount</span>
                <span class="stat-value" id="stat-total">$0.00</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Average Expense</span>
                <span class="stat-value" id="stat-average">$0.00</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Highest Expense</span>
                <span class="stat-value" id="stat-highest">$0.00</span>
            </div>
            <div class="stat-card stat-card-wide">
                <span class="stat-label">Top Category</span>
                <span class="stat-value" id="stat-top-category">&mdash;</span>
            </div>
        </section>

        <section class="list-controls">
            <input type="text" id="search-input" placeholder="Search by description...">
            <select id="category-filter-select">
                <option value="All" selected>All Categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Health">Health</option>
                <option value="Other">Other</option>
            </select>
            <select id="sort-select">
                <option value="newest" selected>Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="highest">Highest Amount</option>
                <option value="lowest">Lowest Amount</option>
                <option value="az">A&ndash;Z</option>
                <option value="za">Z&ndash;A</option>
            </select>
        </section>

        <ul id="expenses-list"></ul>
    </main>

    <script src="app.js"></script>
</body>

</html>
